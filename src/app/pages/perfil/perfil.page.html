<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/inicial"
        text="Voltar"></ion-back-button></ion-buttons><ion-title>Meu perfil</ion-title></ion-toolbar></ion-header>
<ion-content class="ion-padding">
  <div class="form-container">
    <p *ngIf="carregando" role="status">Carregando perfil…</p>
    <p *ngIf="mensagem" [attr.role]="sucesso ? 'status' : 'alert'" [class.mensagem-erro]="!sucesso">{{ mensagem }}</p>
    <ion-button *ngIf="!carregando && !carregado" (click)="ionViewWillEnter()">Tentar novamente</ion-button>
    <form *ngIf="carregado" (ngSubmit)="salvar()">
      <h2>Dados pessoais</h2>
      <ion-item><ion-input label="Nome" labelPlacement="stacked" autocomplete="name" [(ngModel)]="nome" name="nome"
          [disabled]="salvando"></ion-input></ion-item>
      <ion-item><ion-input label="E-mail" labelPlacement="stacked" [value]="email" readonly></ion-input></ion-item>
      <ion-item><ion-input label="Telefone" labelPlacement="stacked" type="tel" autocomplete="tel"
          [(ngModel)]="telefone" name="telefone" [disabled]="salvando"></ion-input></ion-item>
      <h2>Preferências</h2>
      <ion-item><ion-range label="Velocidade da voz" labelPlacement="stacked" [(ngModel)]="rate" name="rate" [min]="0.5"
          [max]="2" [step]="0.1" [snaps]="true" [pin]="true" [disabled]="salvando"></ion-range></ion-item>
      <ion-item><ion-range label="Tom da voz" labelPlacement="stacked" [(ngModel)]="pitch" name="pitch" [min]="0.5"
          [max]="2" [step]="0.1" [snaps]="true" [pin]="true" [disabled]="salvando"></ion-range></ion-item>
      <h3 id="tamanho-label">Tamanho dos pictogramas</h3>
      <ion-segment aria-labelledby="tamanho-label" [(ngModel)]="pictogramSize" name="size" [disabled]="salvando">
        <ion-segment-button value="pequeno"><ion-label>Pequeno</ion-label></ion-segment-button>
        <ion-segment-button value="medio"><ion-label>Médio</ion-label></ion-segment-button>
        <ion-segment-button value="grande"><ion-label>Grande</ion-label></ion-segment-button>
      </ion-segment>
      <ion-button type="submit" expand="block" [disabled]="salvando">{{ salvando ? 'Salvando…' : 'Salvar'
        }}</ion-button>
    </form>
  </div>
</ion-content>
