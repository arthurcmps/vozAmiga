<ion-header><ion-toolbar>
  <ion-buttons slot="start"><ion-back-button defaultHref="/inicial" text="Voltar"></ion-back-button></ion-buttons>
  <ion-title>Pessoas</ion-title>
</ion-toolbar></ion-header>
<ion-content class="ion-padding">
  <p *ngIf="erro" role="alert" class="mensagem-erro">{{ erro }}</p>
  <p *ngIf="configService.error" role="status">{{ configService.error }}</p>
  <ion-grid><ion-row>
    <ion-col size="6" size-md="4" *ngFor="let frase of frases">
      <ion-card class="pictogram-card" [class.selecionado]="frase.selecionado" [ngClass]="pictogramClass">
        <button type="button" class="frase-falar" (click)="falar(frase)" [attr.aria-label]="'Falar: ' + frase.texto">
          <img [src]="frase.icon" alt="" width="150" height="150" />
          <span>{{ frase.texto }}</span>
        </button>
        <ion-button fill="clear" class="favorito-toggle" (click)="alternarFavorito(frase)"
          [attr.aria-label]="(estaNosFavoritos(frase) ? 'Remover dos favoritos: ' : 'Adicionar aos favoritos: ') + frase.texto"
          [attr.aria-pressed]="estaNosFavoritos(frase)">
          <ion-icon slot="icon-only" [name]="estaNosFavoritos(frase) ? 'star' : 'star-outline'" aria-hidden="true"></ion-icon>
        </ion-button>
      </ion-card>
    </ion-col>
  </ion-row></ion-grid>
  <div class="button-container"><ion-button routerLink="/favoritos">Favoritos</ion-button></div>
</ion-content>
