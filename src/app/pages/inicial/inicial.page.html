<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>O que você quer dizer?</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="6" size-md="4" *ngFor="let categoria of categorias">
        <ion-card [button]="true" (click)="abrirCategoria(categoria)" [attr.aria-label]="categoria.nome">
          <ion-img [src]="categoria.icone" alt=""></ion-img>
          <ion-card-content class="ion-text-center">{{categoria.nome}}</ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <div class="button-container">
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        Sair
      </ion-button>

      <ion-button routerLink="/favoritos">
        <ion-icon name="star" slot="start"></ion-icon>
        Favoritos
      </ion-button>

      <ion-button routerLink="/perfil">
        <ion-icon name="person-circle-outline" slot="start"></ion-icon>
        Perfil
      </ion-button>
    </div>
  </ion-grid>
</ion-content>
